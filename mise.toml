[tools]
go = "1.27.3"
"go:github.com/sqlc-dev/sqlc/cmd/sqlc" = "1.31.1"
"go:github.com/pressly/goose/v3/cmd/goose" = "3.27.1"
golangci-lint = "2.15.0"
goreleaser = "2.6.1"
lefthook = "2.1.16"

[env]
# Local settings (Discord credentials, etc.); see .env.example. Optional.
_.file = ".env"

[tasks]
start = { run = "./bin/racket", depends = ["build"], description = "build and run the server on port 8080" }

dev = { run = "go run ./cmd/server", env = { RACKET_DEV_LOGIN = "1" }, description = "run the server with dev login" }

build = { run = "go build -ldflags='-s' -o=./bin/racket ./cmd/server", description = "build local binary" }

lint = { run = "golangci-lint run", description = "run golangci-lint" }
test = { run = "go test -race -v ./...", description = "run tests" }
fmt = { run = "golangci-lint fmt", description = "format the project" }
