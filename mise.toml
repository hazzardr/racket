[tools]
go = "1.26.4"
node = "24.18.0"
pnpm = "10.8.0"
"go:github.com/sqlc-dev/sqlc/cmd/sqlc" = "1.31.1"
"go:github.com/pressly/goose/v3/cmd/goose" = "3.27.1"
golangci-lint = "2.12.2"
goreleaser = "2.6.1"

[tasks]
start = { run = "go run ./cmd/server", description = "build frontend and run the server on port 8080", depends = ["frontend/build"] }

dev = { run = '''
mise run frontend/dev & FRONTEND_PID=$!
trap "kill $FRONTEND_PID 2>/dev/null || true" EXIT
go run ./cmd/server
''', description = "run vite dev server and go server", depends = ["frontend/install"] }

build = { run = "go build -ldflags='-s' -o=./bin/racket ./cmd/server", description = "build local binary", depends = ["frontend/build"] }

lint = { run = "golangci-lint run", description = "run golangci-lint" }
test = { run = "go test -v ./...", description = "run tests" }
fmt = { run = "go fmt ./...", description = "format the project" }

"frontend/install" = { run = "pnpm install --frozen-lockfile", description = "install frontend dependencies", dir = "frontend", env = { CI = "true" } }
"frontend/build" = { run = "pnpm run build", description = "build frontend for production", dir = "frontend", depends = ["frontend/install"] }
"frontend/dev" = { run = "pnpm run dev", description = "run vite dev server", dir = "frontend" }
