version: "2"
sql:
  - engine: "sqlite"
    schema: "migrations"
    queries: "internal/db/queries.sql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "database/sql"
        overrides:
          - db_type: "TIMESTAMP"
            go_type: "time.Time"
          - db_type: "DATETIME"
            go_type: "time.Time"
