{{define "category_chips"}}
<div class="slot-chips">
  {{range .Cats}}
  <form method="post" action="/machines/{{$.Machine.ID}}/slots" class="inline-form"
        hx-post="/machines/{{$.Machine.ID}}/slots" hx-target="#add-slot-card" hx-swap="beforebegin">
    <input type="hidden" name="category" value="{{.}}">
    <button type="submit" class="btn btn-small">+ {{.}}</button>
  </form>
  {{end}}
</div>
{{end}}
