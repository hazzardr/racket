{{define "slot_card"}}
<div class="card slot-card" id="slot-{{.ID}}">
  <div class="slot-header">
    <h3 class="slot-category">{{.Category}}</h3>
    <form method="post" action="/slots/{{.ID}}/delete" class="inline-form"
          hx-post="/slots/{{.ID}}/delete" hx-target="#slot-{{.ID}}" hx-swap="delete">
      <button type="submit" class="btn-remove-slot" title="Remove slot">&times;</button>
    </form>
  </div>
  {{if .PartID.Valid}}
  <div class="slot-part">
    <span class="part-name">{{.PartName.String}}</span>
    {{if .PartModel.Valid}}<span class="part-model">{{.PartModel.String}}</span>{{end}}
    <form method="post" action="/slots/{{.ID}}/part/delete" class="inline-form"
          hx-post="/slots/{{.ID}}/part/delete" hx-target="#slot-{{.ID}}" hx-swap="outerHTML">
      <button type="submit" class="btn btn-small">Remove</button>
    </form>
  </div>
  {{else}}
  <form class="slot-form" method="post" action="/slots/{{.ID}}/part"
        hx-post="/slots/{{.ID}}/part" hx-target="#slot-{{.ID}}" hx-swap="outerHTML">
    <input name="name" type="text" placeholder="Part name" required>
    <input name="manufacturer" type="text" placeholder="Manufacturer">
    <input name="model" type="text" placeholder="Model">
    <button type="submit" class="btn btn-small">Add</button>
  </form>
  {{end}}
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
</div>
{{end}}
