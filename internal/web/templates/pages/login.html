{{template "page_top" .}}
{{with .Data}}
<section class="login">
  <h2 class="section-title">Log in</h2>
  {{if .Error}}<div class="status error">{{.Error}}</div>{{end}}
  {{if .Discord}}
  <p class="lead">Racket is for members of our Discord server.</p>
  <p><a href="/auth/discord" class="btn">Log in with Discord</a></p>
  {{end}}
  {{if .DevLogin}}
  <form class="form dev-login" method="post" action="/auth/dev">
    <p class="meta">Dev login is on: pick any username, no Discord needed.</p>
    <label>
      Username
      <input name="username" type="text" maxlength="32" required autofocus>
    </label>
    <div class="form-actions">
      <button type="submit" class="btn">Log in (dev)</button>
    </div>
  </form>
  {{end}}
</section>
{{end}}
{{template "page_bottom" .}}
