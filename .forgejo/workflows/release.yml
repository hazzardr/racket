name: Release

# Tags are cut from main, whose head is always a commit that passed CI on its
# PR (see ci.yml). So instead of testing again: check that the tagged commit
# has a green CI status, re-run govulncheck (the vulnerability database moves
# even when the code doesn't), then release.
on:
    push:
        tags:
            - "v*"

jobs:
    release:
        name: Release
        runs-on: docker
        container:
            image: localhost/brihome-go-ci:1.27
        steps:
            # Looks only at CI's statuses: this run's own pending status is on
            # the same commit. Fails on a commit that never went through a PR.
            - name: Require a green CI run on the tagged commit
              env:
                  TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  URL: https://code.brihome.me/api/v1/repos/${{ github.repository }}/commits/${{ github.sha }}/status
              run: |
                  node -e '
                    (async () => {
                      const res = await fetch(process.env.URL, { headers: { Authorization: `token ${process.env.TOKEN}` } });
                      if (!res.ok) throw new Error(`status API: HTTP ${res.status}`);
                      const ci = ((await res.json()).statuses || []).filter((s) => s.context.startsWith("CI / "));
                      for (const s of ci) console.log(`${s.context}: ${s.status}`);
                      if (ci.length === 0 || ci.some((s) => s.status !== "success")) {
                        console.error("No green CI run on this commit. Tag a commit from main that passed CI on its PR.");
                        process.exit(1);
                      }
                    })().catch((e) => { console.error(e.message); process.exit(1); });
                  '

            - name: Checkout
              uses: https://github.com/actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Cache Go modules and build output
              uses: https://github.com/actions/cache@v4
              with:
                  path: |
                      /go/pkg/mod
                      /root/.cache/go-build
                  key: go-1.27-${{ hashFiles('go.sum') }}
                  restore-keys: go-1.27-

            - name: Run govulncheck
              run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

            - name: Run GoReleaser
              uses: https://github.com/goreleaser/goreleaser-action@v7
              with:
                  # Keep in step with goreleaser in mise.toml and ci.yml.
                  version: "v2.6.1"
                  args: release --clean
              env:
                  GITEA_TOKEN: ${{ secrets.goreleaser_token }}
