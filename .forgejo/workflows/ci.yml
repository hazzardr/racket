name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: docker
    container:
      image: docker.io/golang:1.26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        run: |
          go mod download
          go build ./...
          go vet ./...
          go test ./...

  lint:
    name: Lint
    runs-on: docker
    container:
      image: docker.io/golangci/golangci-lint:v2.12.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run golangci-lint
        run: golangci-lint run

  release:
    name: Release
    runs-on: docker
    if: startsWith(github.ref, 'refs/tags/')
    container:
      image: docker.io/goreleaser/goreleaser:v2.6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GoReleaser
        env:
          GITEA_TOKEN: ${{ secrets.goreleaser_token }}
        run: goreleaser release --clean
