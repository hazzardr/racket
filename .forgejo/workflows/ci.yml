name: CI

on:
    push:
        branches:
            - main
        tags:
            - "*"
    pull_request:

jobs:
    build-and-lint:
        name: Build and lint
        runs-on: docker
        steps:
            - name: Checkout
              uses: https://github.com/actions/checkout@v4

            - name: Set up Go
              uses: https://github.com/actions/setup-go@v5
              with:
                  go-version: "1.26"

            - name: Set up Node
              uses: https://github.com/actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Set up pnpm
              uses: https://github.com/pnpm/action-setup@v4
              with:
                  version: "10.8.0"

            - name: Build frontend
              run: pnpm -C frontend install --frozen-lockfile && pnpm -C frontend run build

            - name: Build and test
              run: |
                  go mod download
                  go build ./...
                  go vet ./...
                  go test ./...

            - name: Run golangci-lint
              uses: https://github.com/golangci/golangci-lint-action@v7
              with:
                  version: v2.12.2
                  install-mode: binary

    release:
        name: Release
        runs-on: docker
        if: startsWith(github.ref, 'refs/tags/')
        steps:
            - name: Checkout
              uses: https://github.com/actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: https://github.com/actions/setup-go@v5
              with:
                  go-version: "1.26"

            - name: Set up Node
              uses: https://github.com/actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Set up pnpm
              uses: https://github.com/pnpm/action-setup@v4
              with:
                  version: "10.8.0"

            - name: Run GoReleaser
              uses: https://github.com/goreleaser/goreleaser-action@v7
              with:
                  version: "~> v2"
                  args: release --clean
              env:
                  GITEA_TOKEN: ${{ secrets.goreleaser_token }}
